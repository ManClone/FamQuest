services:
  live-db:
    restart: unless-stopped
    security_opt: &id001
    - no-new-privileges:true
    image: postgres:16-alpine
    env_file: /share/Container/famquest-central-stage/postgres.env
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - test -s /var/lib/postgresql/data/PG_VERSION; test "$$(cat /var/lib/postgresql/data/PG_VERSION)"
      = 16; exec docker-entrypoint.sh postgres
    volumes:
    - live-db:/var/lib/postgresql/data
    networks:
    - data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$$POSTGRES_USER" -d postgres
      interval: 5s
      timeout: 5s
      retries: 20
  live-gateway:
    restart: unless-stopped
    security_opt: *id001
    image: nginx:stable-alpine
    entrypoint:
    - nginx
    - -c
    - /live-config/nginx.conf
    - -g
    - daemon off;
    volumes:
    - live-config:/live-config:ro
    networks:
      front:
        aliases:
        - famquest-live-gateway
    read_only: true
    tmpfs:
    - /tmp
    - /var/cache/nginx
    - /var/run
  live-app:
    restart: unless-stopped
    security_opt: *id001
    image: ghcr.io/manclone/famquest:latest
    entrypoint:
    - python
    - -c
    command:
    - 'import json, os, socket, subprocess

      from pathlib import Path

      values = json.loads(Path(''/live-config/runtime.json'').read_text())

      os.environ.update(values)

      subprocess.run([''python'', ''-m'', ''app.deployment_check''], check=True)

      trusted = socket.gethostbyname(''live-gateway'')

      os.execvp(''uvicorn'', [''uvicorn'', ''app.multitenant_app:create_app'', ''--factory'',
      ''--host'', ''0.0.0.0'', ''--port'', ''8080'', ''--proxy-headers'', ''--forwarded-allow-ips'',
      trusted, ''--log-level'', ''info''])

      '
    volumes:
    - live-config:/live-config:ro
    - live-uploads:/data/uploads
    networks:
    - front
    - data
    - egress
    depends_on:
      live-db:
        condition: service_healthy
      live-gateway:
        condition: service_started
    read_only: true
    tmpfs:
    - /tmp
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; req=urllib.request.Request('http://live-gateway:8080/api/health',headers={'Host':'famquest.websiteclone.de'});
        res=urllib.request.urlopen(req,timeout=3); assert res.status==200
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    pull_policy: always
  live-mcp:
    restart: unless-stopped
    security_opt: *id001
    image: ghcr.io/manclone/famquest-mcp@sha256:31ef5593c50ae2db0edeac6d5d18b593aca5bd7d93fdd8d5131d30e0b4d2bb2e
    command:
    - python
    - -c
    - "import asyncio\nimport central_server\noriginal = central_server.CentralTransport.handle_async_request\n\
      async def supported_encoding(self, request):\n    request.headers['accept-encoding']\
      \ = 'gzip, deflate'\n    return await original(self, request)\ncentral_server.CentralTransport.handle_async_request\
      \ = supported_encoding\nasyncio.run(central_server.main())\n"
    environment:
      FAMQUEST_PUBLIC_URL: https://famquest.websiteclone.de
    depends_on:
      live-app:
        condition: service_healthy
    networks:
    - front
    - egress
    read_only: true
    tmpfs:
    - /tmp
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command:
    - tunnel
    - run
    env_file:
    - /share/Container/famquest/.env
    networks:
    - front
    - egress
    depends_on:
      live-app:
        condition: service_healthy
      live-mcp:
        condition: service_started
  backup:
    image: postgres:16-alpine
    restart: 'no'
    profiles:
    - backup
    env_file: /share/Container/famquest-central-stage/postgres.env
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - "#!/bin/sh\n# Embedded in Compose by prepare-live-backup.py; coordinated scheduler\
      \ only.\nset -eu\nif test \"$${FAMQUEST_BACKUP_COORDINATED:-0}\" != 1; then\n\
      \    echo 'SKIP: use the coordinated scheduler to pause app and MCP first.'\n\
      \    exit 0\nfi\numask 077\nexport PGPASSWORD=\"$$POSTGRES_PASSWORD\"\nexport\
      \ PGHOST=live-db PGUSER=\"$$POSTGRES_USER\" PGCONNECT_TIMEOUT=10\nSTAMP=\"$$(date\
      \ -u +%Y%m%dT%H%M%SZ)\"\nmkdir \"/backups/live-$$STAMP\"\ncd \"/backups/live-$$STAMP\"\
      \nmkdir databases\npg_dumpall --globals-only --file=globals.sql\n# Include every\
      \ non-template database, including all future prepared family slots.\npsql -X\
      \ -At -v ON_ERROR_STOP=1 --dbname=postgres \\\n    -c 'SELECT datname FROM pg_database\
      \ WHERE NOT datistemplate ORDER BY datname' > DATABASES\nwhile IFS= read -r\
      \ database; do\n    case \"$$database\" in ''|*[!a-z0-9_]*) echo 'FAIL: unsupported\
      \ database name'; exit 1 ;; esac\n    pg_dump --format=custom --create --dbname=\"\
      $$database\" --file=\"databases/$$database.dump\"\n    pg_restore --list \"\
      databases/$$database.dump\" > /dev/null\ndone < DATABASES\n# Keep original paths\
      \ for existing restore instructions.\ncp databases/famquest_auth.dump auth.dump\n\
      cp databases/famquest_grasser_runtime.dump family.dump\ntest -z \"$$(find /source-uploads\
      \ -type l -print -quit)\"\ntar -czf uploads.tar.gz -C /source-uploads .\ntar\
      \ -tzf uploads.tar.gz > /dev/null\ncp /source-config/runtime.json runtime.json\n\
      cp /source-config/gateway.conf gateway.conf\ncp /source-config/nginx.conf nginx.conf\n\
      sha256sum globals.sql auth.dump family.dump uploads.tar.gz runtime.json \\\n\
      \    gateway.conf nginx.conf DATABASES databases/*.dump > SHA256SUMS\nsha256sum\
      \ -c SHA256SUMS > /dev/null\ntouch BACKUP-COMPLETE\necho 'PASS: live central\
      \ registry, all databases, role definitions, uploads and runtime configuration\
      \ saved privately. Actual restore not performed.'\n"
    networks:
    - data
    volumes:
    - /share/Container/famquest-live/backups:/backups
    - live-config:/source-config:ro
    - live-uploads:/source-uploads:ro
    read_only: true
    tmpfs:
    - /tmp
    security_opt:
    - no-new-privileges:true
networks:
  data:
    internal: true
  front:
    internal: true
  egress: {}
volumes:
  live-db:
    external: true
    name: famquest-release-v2-db
  live-uploads:
    external: true
    name: famquest-release-v2-runtime-uploads
  live-config:
    external: true
    name: famquest-live-config-v1
