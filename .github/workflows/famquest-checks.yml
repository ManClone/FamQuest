name: FamQuest predeployment checks
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run test
        working-directory: frontend
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: famquest
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: famquest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U famquest -d famquest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_USER: famquest
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_DB: famquest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
        working-directory: backend
      - run: uv run python -m compileall -q app tests
        working-directory: backend
      - run: uv run alembic heads
        working-directory: backend
      - run: uv run pytest
        working-directory: backend
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target runtime -t famquest:ci .
